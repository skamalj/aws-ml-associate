[project]
name = "aws-ml-associate"
version = "0.1.0"
description = "Practice notebooks for the AWS Certified Machine Learning Engineer - Associate (MLA-C02) exam"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "boto3>=1.42",
    "sagemaker>=2.240,<3",       # the notebooks use SageMaker Python SDK v2 (Estimator, Pipelines, Model Monitor ...)
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "requests",
    "matplotlib",
    "pillow",
    "jupyterlab",
    "ipykernel",
    "xgboost",                   # local experiments in 2.2a / 2.3a
    "imbalanced-learn",          # SMOTE in 1.3
    "pytest",                    # prompt regression tests in 3.3b, CI tests in 3.3a
    # Experiment tracking (2.3a)
    "mlflow",
    "sagemaker-mlflow",
    # NLP evaluation metrics (2.3b)
    "nltk",
    "rouge-score",
    "bert-score",                # pulls in torch and downloads a small model on first use
    # OpenSearch client (1.1b)
    "opensearch-py",
    # Agents (3.1b, 3.2b)
    "strands-agents[a2a]",
    "bedrock-agentcore",
    "mcp",
    # Bedrock API keys demo (4.3b)
    "aws-bedrock-token-generator",
]

[tool.uv]
package = false                  # a folder of notebooks, not an installable package

[dependency-groups]
dev = ["jupytext"]               # only for tools/build_nb.py
